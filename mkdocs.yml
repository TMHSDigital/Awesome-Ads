site_name: Awesome Ads
site_url: https://tmhsdigital.github.io/Awesome-Ads/
site_description: A practical advertising playbook for small businesses
site_author: TMHSDigital
repo_url: https://github.com/TMHSDigital/Awesome-Ads
repo_name: TMHSDigital/Awesome-Ads
edit_uri: edit/main/docs/

exclude_docs: |
  **/AGENTS.md
  README.md

# Built with Zensical. The build reads mkdocs.gen.yml, which
# scripts/prepare-mkdocs.py writes from this file plus the sidebar nav.
theme:
  name: material
  variant: classic
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

plugins:
  - search
  # Each page's description is its first paragraph. Search engines shorten
  # long descriptions themselves, at a word boundary.
  - meta-descriptions:
      trim: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
