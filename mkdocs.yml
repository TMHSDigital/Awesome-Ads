site_name: Awesome Ads
site_url: https://tmhsdigital.github.io/Awesome-Ads/
site_description: A practical advertising playbook for small businesses
site_author: TMHSDigital
repo_url: https://github.com/TMHSDigital/Awesome-Ads
repo_name: TMHSDigital/Awesome-Ads
edit_uri: edit/main/docs/

exclude_docs: |
  **/AGENTS.md
  README.md

# Built with Zensical. The build reads mkdocs.gen.yml, which
# scripts/prepare-mkdocs.py writes from this file plus the sidebar nav.
theme:
  name: material
  variant: modern
  custom_dir: overrides
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

# Colors, heading font, and reading width. See docs/stylesheets/extra.css.
extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Each page's description is its first paragraph. Search engines shorten
  # long descriptions themselves, at a word boundary.
  - meta-descriptions:
      trim: false

markdown_extensions:
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
