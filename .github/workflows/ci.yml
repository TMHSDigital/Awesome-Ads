name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint.json
          globs: "**/*.md"

  internal-links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-internal-links.py

  repo-hygiene:
    name: Public repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/check-public-repo-hygiene.py

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt -c constraints-docs.txt
      - run: python -m unittest scripts.test_catalog scripts.test_check_internal_links
      - run: python scripts/prepare-mkdocs.py
      - run: zensical build --strict --config-file mkdocs.gen.yml
